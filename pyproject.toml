[project]
name = "weather-api"
version = "0.1.0"
description = "A minimal FastAPI service that fetches current weather from the Weatherstack API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "httpx>=0.27",
    "pydantic-settings>=2.0",
    "fastapi-cache2>=0.2",
    "slowapi>=0.1",
    "fastmcp>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
